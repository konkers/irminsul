name: Android

on:
  push:
    branches: ["android"]

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "27.0.12077973"
  RUST_TARGET: aarch64-linux-android

jobs:
  build_matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: debug
            gradle_task: assembleDebug
            artifact_name: irminsul-debug.apk
            apk_path: android/app/build/outputs/apk/debug/app-debug.apk
          - build_type: release
            gradle_task: assembleRelease
            artifact_name: irminsul-release.apk
            apk_path: android/app/build/outputs/apk/release/app-release.apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
      - run: rustup target add ${{ env.RUST_TARGET }}
      - run: cargo install cargo-ndk
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: android-${{ matrix.build_type }}-${{ hashFiles('**/Cargo.lock', 'android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
      - name: Update APK version
        working-directory: android/app
        run: |
          VERSION=$(grep '^version' ../../Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" build.gradle
      - if: matrix.build_type == 'release'
        name: Decode keystore
        working-directory: android/app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew ${{ matrix.gradle_task }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.apk_path }}
